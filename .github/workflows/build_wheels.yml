name: Build OpenSim Python wheels

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  OPENSIM_BUILD_WHEELS: 'on'

jobs:
  build_windows_wheels:

    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: '3.11'
          python-tag: cp311
        - python-version: '3.12'
          python-tag: cp312
        - python-version: '3.13'
          python-tag: cp313

    env:
      OPENSIM_BUILD_JOBS: 4

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Python packages
      id: setup
      uses: actions/setup-python@v4
      with:
        python-version: '${{ matrix.python-version }}'

    - name: Install numpy
      # Need numpy to use SWIG numpy typemaps; pyyaml is read by install_opensim.py.
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy pyyaml

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure opensim-core
      id: configure
      run: |
        echo "CMAKE_INSTALL_PREFIX=dependencies/opensim/opensim_core_install" >> $GITHUB_OUTPUT

    - name: Build opensim-core
      working-directory: dependencies
      run: |
        python -c "import sys, yaml; yaml.safe_dump({'python_root_dir': sys.prefix}, open('config.yaml','w'))"
        python install_opensim.py --from-source

    - name: Build wheel
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python"
        pip wheel . --no-deps --wheel-dir dist

    - name: Capture wheel path
      id: wheel
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist"
        WHEEL=$(ls -1 opensim*.whl | head -n1)
        echo "path=$WHEEL" >> $GITHUB_OUTPUT

    - name: Upload windows wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheels-windows-${{ matrix.python-tag }}
        path: ${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist/opensim*.whl
        overwrite: true

    - name: Test Python bindings
      # Installed into a clean venv rather than the build environment, so that the
      # test proves the wheel is self-contained rather than picking up libraries
      # left behind by the build.
      run: |
        python -m venv smoke-venv
        smoke-venv/Scripts/pip install "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist/${{ steps.wheel.outputs.path }}"
        smoke-venv/Scripts/python -c "
        import opensim
        print(opensim.GetVersionAndDate())
        opensim.Model().initSystem()
        print('import and initSystem OK')
        "

  build_osx_wheels:
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: '3.11'
          python-tag: cp311
        - python-version: '3.12'
          python-tag: cp312
        - python-version: '3.13'
          python-tag: cp313

    env:
      OPENSIM_BUILD_JOBS: 3

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Python packages
      uses: actions/setup-python@v4
      with:
        python-version: '${{ matrix.python-version }}'

    - name: Install numpy
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy pyyaml build delocate

    - name: Install SWIG
      run: brew install swig

    - name: Configure opensim-core
      id: configure
      run: |
        echo "CMAKE_INSTALL_PREFIX=dependencies/opensim/opensim_core_install" >> $GITHUB_OUTPUT

    - name: Build opensim-core
      working-directory: dependencies
      run: |
        python -c "import sys, yaml; yaml.safe_dump({'python_root_dir': sys.prefix}, open('config.yaml','w'))"
        python install_opensim.py --from-source

    - name: Build wheel
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python"
        python -m build --wheel .

    - name: Delocate check
      # Diagnostic only. The package is made standalone by OPENSIM_PYTHON_STANDALONE
      # plus @loader_path rpaths rather than by delocate, so this is here to surface
      # any dylib still resolving outside the wheel.
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python"
        delocate-listdeps --all dist/*.whl || true

    - name: Capture wheel path
      id: wheel
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist"
        WHEEL=$(ls -1 opensim*.whl | head -n1)
        echo "path=$WHEEL" >> $GITHUB_OUTPUT

    - name: Upload osx wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheels-macos-${{ matrix.python-tag }}
        path: ${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist/opensim*.whl
        overwrite: true

    - name: Test Python bindings
      run: |
        python -m venv smoke-venv
        smoke-venv/bin/pip install "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist/${{ steps.wheel.outputs.path }}"
        env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH smoke-venv/bin/python -c "
        import opensim
        print(opensim.GetVersionAndDate())
        opensim.Model().initSystem()
        print('import and initSystem OK with no DYLD_LIBRARY_PATH')
        "

  build_linux_wheels:

    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    strategy:
      fail-fast: false
      matrix:
        python: ["cp311", "cp312", "cp313"]

    env:
      OPENSIM_BUILD_JOBS: 4

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set Python
      run: |
        echo "PY=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin/python" >> $GITHUB_ENV
        echo "/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin" >> $GITHUB_PATH

    - name: Install Numpy
      # cmake and ninja come from pip because the manylinux image ships neither;
      # pyyaml is read by install_opensim.py.
      run: |
        $PY -m pip install --upgrade pip
        $PY -m pip install numpy pyyaml cmake ninja build auditwheel

    - name: Install packages
      run: |
        yum -y install \
        gcc \
        gcc-c++ \
        make \
        libtool \
        autoconf \
        automake \
        pkgconfig \
        pcre2-devel \
        gcc-gfortran \
        openblas-devel \
        lapack-devel \
        freeglut-devel \
        libXi-devel \
        libXmu-devel \
        wget \
        tar \
        gzip \
        patchelf

    - name: Mark workspace as safe for git (manylinux container)
      # install_opensim.py shells out to git in the workspace and each submodule.
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/opensim-core"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/simbody"

    - name: Configure opensim-core
      id: configure
      run: |
        echo "CMAKE_INSTALL_PREFIX=dependencies/opensim/opensim_core_install" >> $GITHUB_OUTPUT

    - name: Build opensim-core
      working-directory: dependencies
      run: |
        $PY -c "import sys, yaml; yaml.safe_dump({'python_root_dir': sys.prefix}, open('config.yaml','w'))"
        $PY install_opensim.py --from-source

    - name: Build wheel
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python"
        $PY -m build --wheel .

    - name: Twine and audit check
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python"
        $PY -m pip install --upgrade twine
        $PY -m twine check dist/*
        for whl in dist/*.whl; do
          echo "=== $whl ==="
          $PY -m auditwheel show "$whl"
        done

    - name: Repair wheels
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python"
        mkdir -p dist/repaired
        for whl in dist/*.whl; do
          echo "Repairing $whl"
          $PY -m auditwheel repair "$whl" -w dist/repaired/
        done

    - name: Capture wheel path
      id: wheel
      run: |
        cd "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist/repaired"
        WHEEL=$(ls -1 opensim*.whl | head -n1)
        echo "path=$WHEEL" >> $GITHUB_OUTPUT

    - name: Upload linux wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-${{ matrix.python }}
        path: ${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist/repaired/opensim*.whl
        overwrite: true

    - name: Test Python bindings
      run: |
        $PY -m venv smoke-venv
        smoke-venv/bin/pip install "${{ steps.configure.outputs.CMAKE_INSTALL_PREFIX }}/sdk/Python/dist/repaired/${{ steps.wheel.outputs.path }}"
        env -u LD_LIBRARY_PATH smoke-venv/bin/python -c "
        import opensim
        print(opensim.GetVersionAndDate())
        opensim.Model().initSystem()
        print('import and initSystem OK with no LD_LIBRARY_PATH')
        "

  publish_draft_release:

    needs: [build_windows_wheels, build_osx_wheels, build_linux_wheels]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: wheels-*
        merge-multiple: true

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        OSIM_SHA=$(git ls-tree HEAD opensim-core | awk '{print $3}')
        SIMBODY_SHA=$(git ls-tree HEAD simbody | awk '{print $3}')
        VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        TAG="v$VERSION"

        cat > notes.md <<EOF
        <!-- Describe the changes to osimfit in this release above the line below. -->

        ---
        The OpenSim Python wheels attached to this release are built from the following commits:
        - opensim-org/opensim-core@${OSIM_SHA}
        - simbody/simbody@${SIMBODY_SHA}
        EOF

        ls -la dist
        gh release create "$TAG" dist/*.whl \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --notes-file notes.md \
          --draft
